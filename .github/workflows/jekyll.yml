name: Build and Deploy Jekyll Site

on:
  push:
    branches: [ source ]  # Change this if you use a different branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 2.3.1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v2

      # Step 2.3.2: Set up Ruby environment
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.1 # Adjust based on your project’s Ruby version

      # Step 2.3.3: Install Bundler and dependencies
      - name: Install dependencies
        run: |
          gem install bundler
          bundle install

      # Step 2.3.4: Build the Jekyll site
      - name: Build site with Jekyll
        run: bundle exec jekyll build

      # Step 2.3.5: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
